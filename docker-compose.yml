# One-command local stack:  cp .env.example .env  &&  docker compose up --build
# Then open http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reviewassist
      POSTGRES_USER: reviewassist
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reviewassist}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewassist -d reviewassist"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reviewassist
      DB_USER: reviewassist
      DB_PASSWORD: ${DB_PASSWORD:-reviewassist}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-flash-lite-latest,gemini-3.1-flash-lite,gemini-3.5-flash}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db-data:
