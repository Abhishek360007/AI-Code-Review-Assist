# Render Blueprint: deploys the app (web + API in one service).
# The database is external (e.g. a free Neon Postgres) and passed in as DATABASE_URL.
# Render dashboard -> New -> Blueprint -> pick this repository.

services:
  - type: web
    name: ai-code-review-assist
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string: postgresql://user:pass@host/db?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: REVIEW_PER_MINUTE_LIMIT
        value: "5"
