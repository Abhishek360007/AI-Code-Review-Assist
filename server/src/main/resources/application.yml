# All secrets and environment-specific values come from environment variables.
# See ../.env.example for the full list.

server:
  port: ${PORT:8080}

spring:
  application:
    name: review-assist
  datasource:
    # Three ways to configure the database, highest priority first:
    #   DATABASE_URL=postgresql://user:pass@host/db?sslmode=require   (Neon, Supabase, Render, Railway...)
    #   DB_URL=jdbc:postgresql://host:5432/db  + DB_USER / DB_PASSWORD
    #   DB_HOST / DB_PORT / DB_NAME            + DB_USER / DB_PASSWORD
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reviewassist}}
    username: ${DB_USER:reviewassist}
    password: ${DB_PASSWORD:reviewassist}
    hikari:
      # Small pool that drains when idle: fits free-tier connection limits and lets
      # serverless Postgres (e.g. Neon) scale to zero between visits.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      idle-timeout: 120000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Must be at least 32 characters. Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:12h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  review:
    max-code-chars: ${REVIEW_MAX_CODE_CHARS:20000}
    # Reviews each user may run per minute (0 disables the limit)
    per-minute-limit: ${REVIEW_PER_MINUTE_LIMIT:10}
  ai:
    # auto   -> use Gemini when GEMINI_API_KEY is set, otherwise the offline demo analyzer
    # gemini -> always use Gemini (fails at startup without a key)
    # demo   -> always use the offline demo analyzer
    provider: ${AI_PROVIDER:auto}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-flash-latest}
      # Tried in order when the main model is overloaded (503/429) or unavailable
      fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-flash-lite-latest,gemini-3.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout: ${GEMINI_TIMEOUT:60s}
